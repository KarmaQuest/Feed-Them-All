services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: fta
      POSTGRES_PASSWORD: fta
      POSTGRES_DB: feedthemall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fta -d feedthemall"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
